[package]
name = "widget-core"
version = "0.8.2"
edition = "2021"
rust-version = "1.75"
description = "Core types for the widget engine"
license = "MIT OR Apache-2.0"
repository = "https://example.com/widget"
keywords = ["widget", "engine"]

[features]
default = ["std"]
std = []
serde = ["dep:serde", "widget-types/serde"]
tokio = ["dep:tokio", "tokio/rt", "tokio/macros"]
full = ["std", "serde", "tokio"]

[dependencies]
bytes = "1.6"
thiserror = "1.0"
widget-types = { path = "../widget-types", version = "0.8" }
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1.37", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "basic"
path = "examples/basic.rs"

[profile.release]
lto = true
codegen-units = 1
