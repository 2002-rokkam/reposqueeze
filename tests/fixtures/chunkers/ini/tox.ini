[tox]
envlist = py39, py310, py311, lint
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests}

[testenv:lint]
skip_install = true
deps =
    ruff
    mypy
commands =
    ruff check src
    mypy src

[pytest]
addopts = -ra --strict-markers
markers =
    slow: marks tests as slow
