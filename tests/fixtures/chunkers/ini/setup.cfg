[metadata]
name = quillcms
version = 2.3.1
description = Content management toolkit
long_description = file: README.md
license = MIT

[options]
python_requires = >=3.9
packages = find:
install_requires =
    requests>=2.31
    pydantic>=2.5
    click>=8.1
zip_safe = False

[options.extras_require]
dev =
    pytest
    black
docs =
    sphinx
    furo

[options.entry_points]
console_scripts =
    quill = quillcms.cli:main

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build
