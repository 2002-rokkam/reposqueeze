# Default values for chart.
replicaCount: 2

image:
  repository: ghcr.io/example/app
  tag: ""
  pullPolicy: IfNotPresent

# -- Service account settings
serviceAccount:
  create: true
  {{- if .Values.annotations }}
  annotations: {}
  {{- end }}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
