openapi: 3.0.3
info:
  title: Orders API
  version: 2.0.0
servers:
  - url: https://api.example.com/v2
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created
  /orders/{orderId}:
    delete:
      operationId: cancelOrder
      summary: Cancel an order
      responses:
        "204":
          description: Cancelled
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
    NewOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
